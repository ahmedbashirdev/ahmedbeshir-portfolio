<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة سيولة — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0D9488; --brand-d:#0B5A52; --violet:#2DC2B0; --lilac:#93DDD2;
  --ok:#16A34A; --warn:#F59E0B; --danger:#DC2626; --info:#0EA5E9;
  --ink:#0F172A; --slate:#475569; --muted:#94A3B8; --line:#E2E8F0;
  --bg:#F1F5F9; --card:#FFFFFF; --soft:#D8F1ED;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07);
  --sh-sm:0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Readex Pro','Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
[dir=ltr] body{font-family:'Inter','Readex Pro',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;top:0;z-index:40;height:62px;
  background:var(--brand-d);color:#fff;display:flex;align-items:center;
  gap:18px;padding-inline:20px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo .mark{width:34px;height:34px;border-radius:9px;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.logo .mark svg{width:100%;height:100%;display:block}
.logo .wm{font-family:'Readex Pro',sans-serif;line-height:1}
.logo .wm small{display:block;font-size:9.5px;font-weight:600;color:#93DDD2;letter-spacing:2px;margin-top:2px}
.roleswitch{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:2px}
.roleswitch button{color:#93DDD2;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.roleswitch button.on{background:#fff;color:var(--brand-d)}
.tb-spacer{flex:1}
.tb-ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);
  display:grid;place-items:center;position:relative;color:#fff}
.tb-ic .dot{position:absolute;top:8px;inset-inline-end:9px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.langbtn{background:rgba(255,255,255,.1);color:#fff;padding:8px 13px;border-radius:10px;font-weight:700;font-size:12.5px}
.tb-user{display:flex;align-items:center;gap:9px}
.tb-user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5EEAD4,#93DDD2);
  display:grid;place-items:center;color:#0B5A52;font-weight:800}
.tb-user .nm{font-size:12.5px;font-weight:700;line-height:1.2}
.tb-user .rl{font-size:11px;color:#93DDD2}

/* ===== LAYOUT ===== */
.shell{display:flex;min-height:calc(100vh - 62px)}
.side{width:248px;background:var(--card);border-inline-start:1px solid var(--line);
  padding:16px 12px;flex-shrink:0}
.side .grp{font-size:11px;color:var(--muted);font-weight:700;padding:14px 12px 6px}
/* بنود المستوى الأعلى: هيكل واحد وارتفاع ثابت 44px للجميع */
.navrow{display:flex;align-items:center;height:44px;border-radius:11px;margin:2px 0;overflow:hidden}
.navrow:hover{background:var(--bg)}
.navrow.on{background:var(--soft)}
.navitem.main{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:11px;padding:0 12px;margin:0;
  background:none;border:0;border-radius:0;color:var(--slate);font-weight:600;font-size:13.5px;
  text-align:start;cursor:pointer;font-family:inherit}
.navrow.on .navitem.main{color:var(--brand)}
.navitem.main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* السهم: خانة جانبية ثابتة بخطّ فاصل */
.navchev{display:flex;align-items:center;justify-content:center;width:34px;height:100%;flex-shrink:0;
  border:0;background:none;color:var(--muted);cursor:pointer;border-inline-start:1px solid var(--line)}
.navrow:hover .navchev{color:var(--brand)}
.navrow.on .navchev{color:var(--brand);border-inline-start-color:rgba(13,148,136,.25)}
.navchev svg{transition:transform .2s ease}
.navchev.open svg{transform:rotate(180deg)}
/* القائمة الفرعية: أصغر (38px) + خطّ إرشادي + إزاحة */
.navsub{margin:2px 8px 6px;border-inline-start:1.5px solid var(--soft)}
.navitem.sub{display:flex;align-items:center;gap:9px;height:38px;width:100%;padding:0 12px;padding-inline-start:26px;
  margin:1px 0;border:0;background:none;border-radius:8px;color:var(--slate);font-size:13px;
  text-align:start;cursor:pointer;font-family:inherit}
.navitem.sub:hover{background:var(--bg)}
.navitem.sub.on{background:var(--soft);color:var(--brand);font-weight:600}
.navitem.sub .ic{width:16px;height:16px;opacity:.85;flex-shrink:0}
/* أيقونة وبادج المستوى الأعلى */
.navitem.main .ic{width:20px;height:20px;flex-shrink:0}
.navitem .badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:10.5px;
  font-weight:700;padding:1px 7px;border-radius:9px}
.main{flex:1;padding:24px 28px;min-width:0}
.crumb{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.h1{font-size:23px;font-weight:800;margin-bottom:3px}
.sub{color:var(--slate);font-size:13px;margin-bottom:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}

/* ===== COMPONENTS ===== */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm)}
.kpi .top{display:flex;align-items:center;justify-content:space-between}
.kpi .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.kpi .lbl{color:var(--slate);font-size:12.5px;font-weight:600;margin-top:10px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px}
.kpi .trend{font-size:11.5px;font-weight:700}
.up{color:var(--ok)} .down{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.card .ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.card .ch h3{font-size:14.5px;font-weight:800}
.card .cb{padding:18px}
.btn{background:var(--brand);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#0F766E}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#15803D}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:start;color:var(--muted);font-weight:700;font-size:11.5px;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--slate)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip .n{opacity:.7;font-size:11px}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bars .bar{width:60%;max-width:42px;background:linear-gradient(180deg,#2DC2B0,#0D9488);
  border-radius:7px 7px 0 0;min-height:6px;transition:.5s}
.bars .bl{font-size:11px;color:var(--muted);font-weight:600}
.prod{display:flex;gap:11px;align-items:center}
.thumb{width:42px;height:42px;border-radius:9px;background:linear-gradient(135deg,#D8F1ED,#CCFBF1);
  display:grid;place-items:center;flex-shrink:0;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;
  font-size:13px;background:var(--card);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--lilac);border-color:var(--brand)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.pcard .img{height:130px;background:linear-gradient(135deg,#D8F1ED,#CCFBF1);display:grid;place-items:center;font-size:40px}
.pcard .body{padding:13px}
.commission{background:#ECFDF5;color:var(--ok);font-weight:800;font-size:12px;padding:3px 9px;border-radius:7px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.dropz{border:2px dashed var(--line);border-radius:11px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px}
.split2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.split3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.minirow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.minirow:last-child{border-bottom:none}
.note{font-size:11.5px;color:var(--muted)}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.split2,.split3{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}}
.hamb{display:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;align-items:center;justify-content:center;flex-shrink:0}
.hamb svg{width:20px;height:20px}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:44}
.scrim.show{display:block}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.split2,.split3{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .hamb{display:flex}
  .roleswitch{order:5;flex:1 0 100%;margin-top:8px;justify-content:center}
  .topbar{height:auto;flex-wrap:wrap;padding-block:10px;gap:10px}
  .side{position:fixed;top:0;inset-inline-start:0;height:100vh;width:264px;z-index:45;
    transition:transform .25s ease;box-shadow:0 0 24px rgba(15,23,42,.18);overflow-y:auto}
  [dir="rtl"] .side{transform:translateX(110%)}
  [dir="ltr"] .side{transform:translateX(-110%)}
  [dir="rtl"] .side.open,[dir="ltr"] .side.open{transform:translateX(0)}
  .main{padding:16px}
  .kpis,.pgrid,.frow{grid-template-columns:1fr}
}
@media(max-width:480px){.kpis{grid-template-columns:1fr}.langbtn .lbl{display:none}.tb-user .nm,.tb-user .rl{display:none}}
.banner{background:linear-gradient(110deg,#0B5A52,#0D9488);color:#fff;border-radius:var(--r);
  padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.banner h2{font-size:17px;font-weight:800}
.banner p{font-size:12.5px;color:#93DDD2}
.donut{width:150px;height:150px;border-radius:50%;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.legend .sw{width:11px;height:11px;border-radius:3px}

/* ===== HBARS ===== */
.hbars{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.hbar{display:flex;flex-direction:column;gap:5px}
.hb-head{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.hb-head b{font-size:12.5px;font-weight:700;color:var(--ink)}
.hb-head span{color:var(--slate);font-weight:600;display:flex;align-items:center;gap:5px}
.hb-head span i{display:inline-block;width:9px;height:9px;border-radius:2px;flex-shrink:0}
.hb-track{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.hb-fill{height:100%;border-radius:4px;transition:.4s}

/* ===== FAIL TAG / CARD ===== */
.ftag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;
  font-size:11px;font-weight:700;font-family:monospace;white-space:nowrap}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--sh-sm);display:flex;gap:14px;align-items:flex-start}
.fcard-body{flex:1;min-width:0}
.fcard-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.fcard-desc{font-size:12.5px;color:var(--slate);margin-bottom:6px}
.fcard-meta{font-size:11.5px;color:var(--muted)}

/* ===== EXPANDABLE TABLE ROW ===== */
.exrow summary{list-style:none;cursor:pointer;display:contents}
.exrow summary::-webkit-details-marker{display:none}
.exrow-panel{background:#F8FAFC;border-top:1px solid var(--line)}
.exrow-panel td{padding:14px 16px!important;border-bottom:none!important}
.exrow-inner{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.exrow-inner{grid-template-columns:1fr}}
.expanel-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.expanel-block h4{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}
.expanel-block p{font-size:12.5px;color:var(--slate);margin-bottom:3px}

/* ===== PAGER ===== */
.pager{display:flex;align-items:center;gap:8px;padding:14px 16px;flex-wrap:wrap}
.pager span{font-size:12px;color:var(--muted);font-weight:600}
.pager button{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-weight:700;color:var(--slate);cursor:pointer}
.pager button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pager .pp{display:flex;align-items:center;gap:5px;margin-inline-start:auto}
.pager .pp select{padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--card)}

/* ===== DATE FILTER BAR ===== */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;margin-bottom:16px}
.filter-bar select,.filter-bar input{padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--bg);color:var(--ink)}
.filter-bar label{font-size:12px;font-weight:700;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:18px}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--slate);background:none;border:0;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{color:var(--brand-d)}
.tabs button.on{color:var(--brand);background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.tabs button .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--slate);font-size:11px;font-weight:700;line-height:1}
.tabs button.on .n{background:var(--soft);color:var(--brand)}
.tabpane{display:none}
.tabpane.on{display:block}

/* ===== REJECTION PANEL ===== */
.reject-banner{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.reject-banner h3{color:#DC2626;font-size:15px;font-weight:800;margin-bottom:6px}
.reject-banner p{font-size:13px;color:#7F1D1D;margin-bottom:10px}
.reject-banner .meta{font-size:11.5px;color:#B91C1C;margin-bottom:12px}

/* ===== MISC ===== */
.info-banner{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:#1E40AF;font-weight:600}
.gov-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.gov-row:last-child{border-bottom:none}
.gov-name{width:90px;font-size:12.5px;font-weight:700;flex-shrink:0}
.gov-bar-wrap{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.gov-bar-fill{height:100%;background:var(--brand);border-radius:4px}
.gov-count{width:40px;text-align:end;font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0}

/* ===== STATS HERO + STATUS TILES (Taager-style) ===== */
.stats-hero{background:linear-gradient(125deg,#0B5A52 0%,#0D9488 55%,#2DC2B0 100%);
  color:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:16px;
  display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:22px;box-shadow:var(--sh);
  align-items:center;position:relative;overflow:hidden}
.stats-hero::after{content:"";position:absolute;inset-block:0;inset-inline-end:-60px;width:240px;
  background:radial-gradient(circle at center,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.hero-l h2{font-size:12px;color:#93DDD2;font-weight:600;margin-bottom:6px;letter-spacing:.5px}
.hero-l .big{font-size:42px;font-weight:800;letter-spacing:-.8px;line-height:1}
.hero-l .meta{font-size:12px;color:#CCFBF1;margin-top:6px;font-weight:600}
.hero-m,.hero-r{border-inline-start:1px solid rgba(255,255,255,.22);padding-inline-start:22px;position:relative;z-index:1}
.hero-m h3,.hero-r h3{font-size:11.5px;color:#93DDD2;font-weight:600;margin-bottom:5px;letter-spacing:.5px}
.hero-m b,.hero-r b{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1;display:block}
.hero-m .pct,.hero-r .pct{font-size:12px;color:#CCFBF1;font-weight:700;margin-top:4px}
@media(max-width:1080px){.stats-hero{grid-template-columns:1fr;gap:14px}.hero-m,.hero-r{border-inline-start:none;border-block-start:1px solid rgba(255,255,255,.22);padding-inline-start:0;padding-block-start:14px}}

.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1080px){.tile-grid{grid-template-columns:repeat(2,1fr)}}
.stile{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px 14px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:3px}
.stile-bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px}
.stl-lbl{font-size:11.5px;color:var(--slate);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.stl-lbl i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.stl-val{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.stl-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}

/* ===== ORDER ROW (Taager-style chevron + timeline) ===== */
.chev{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;
  background:var(--bg);color:var(--slate);transition:.25s;cursor:pointer}
.chev:hover{background:var(--soft);color:var(--brand)}
.exrow-open .chev{background:var(--brand);color:#fff;transform:rotate(180deg)}
.exrow-open td{background:#F8FAFC}
.expanel-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:900px){.expanel-grid{grid-template-columns:1fr}}
.tline{display:flex;flex-direction:column;gap:0;position:relative;padding-inline-start:22px}
.tline::before{content:"";position:absolute;inset-block:8px;inset-inline-start:7px;width:2px;background:var(--line)}
.tstep{position:relative;padding:6px 0 8px 0;font-size:12.5px}
.tstep::before{content:"";position:absolute;inset-inline-start:-22px;top:10px;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);z-index:1}
.tstep.done::before{background:var(--ok);border-color:var(--ok)}
.tstep.current::before{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.tstep .ts-l{font-weight:700;color:var(--ink);font-size:12.5px}
.tstep .ts-d{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.tstep.muted .ts-l{color:var(--muted);font-weight:600}

/* ===== TOGGLE SWITCH ===== */
.tgl{position:relative;display:inline-block;width:36px;height:20px;vertical-align:middle}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl span{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:20px;transition:.2s}
.tgl span::before{content:"";position:absolute;height:14px;width:14px;inset-inline-start:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tgl input:checked + span{background:var(--brand)}
.tgl input:checked + span::before{transform:translateX(16px)}
[dir=rtl] .tgl input:checked + span::before{transform:translateX(-16px)}

/* ===== Default SVG icon size + info-banner layout ===== */
svg.ic{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle}
.kpi .ico svg.ic, .kpi .ico .ic{width:18px;height:18px}
.navitem svg.ic, .navitem .ic{width:20px;height:20px}
.info-banner{display:flex;align-items:center;gap:10px}
.info-banner svg.ic{width:16px;height:16px;color:#1E40AF;flex-shrink:0}
.reject-banner svg.ic{width:18px;height:18px}
.btn svg.ic{width:14px;height:14px}
.tb-ic svg{width:19px;height:19px}
</style>
</head>

function kpi(ic,icbg,iccol,lbl,val,trend,up){
  return `<div class="kpi"><div class="top">
    <div class="ico" style="background:${icbg};color:${iccol}">${svg(IC[ic])}</div>
    ${trend?`<span class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${trend}</span>`:''}</div>
    <div class="lbl">${lbl}</div><div class="val">${val}</div></div>`;
}
function bars(data){
  const mx=Math.max(...data.map(d=>d[1]));
  return `<div class="bars">${data.map(d=>`<div class="col">
    <div class="bar" style="height:${Math.round(d[1]/mx*100)}%"></div>
    <div class="bl">${d[0]}</div></div>`).join('')}</div>`;
}
function donut(segs){
  let acc=0;const stops=segs.map(s=>{const a=acc;acc+=s[2];return `${s[1]} ${a}% ${acc}%`;}).join(',');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <div class="donut" style="background:conic-gradient(${stops})"></div>
    <div class="legend">${segs.map(s=>`<div class="li">
      <span class="sw" style="background:${s[1]}"></span>${s[0]} <b style="margin-inline-start:4px">${s[2]}%</b></div>`).join('')}</div></div>`;
}
function tbl(cols,rows){

function hbars(rows){
  const mx=Math.max(...rows.map(r=>r[1]));
  return `<div class="hbars">`+rows.map(r=>`
    <div class="hbar"><div class="hb-head"><b>${r[1]}</b><span><i style="background:${r[2]}"></i>${r[0]}</span></div>
    <div class="hb-track"><div class="hb-fill" style="width:${Math.round(r[1]/mx*100)}%;background:${r[2]}"></div></div></div>`).join('')+`</div>`;
}

          <div class="note">${int.status==='connected'?(lang=='ar'?'متصل':'Connected'):(lang=='ar'?'متاح':'Available')}</div></div>
        <button class="btn sm" ${int.status==='connected'?'style="background:var(--soft);color:var(--brand)"':''}>${int.status==='connected'?t('manage'):t('connect')}</button>
      </div></div>`).join('')}
  </div>`;}

S["admin/integrations"]=()=>head(t("admin")+" · "+t("integrations"),t("integrations"),
  lang=="ar"?"إدارة تكاملات المنصّة مع منصّات التجارة الإلكترونية":"Manage platform integrations with e-commerce platforms")+intgBody();
S["merchant/integrations"]=()=>head(t("merchant")+" · "+t("integrations"),t("integrations"),
  lang=="ar"?"ربط متجرك بمنصّات التجارة الإلكترونية":"Connect your store to e-commerce platforms")+intgBody();
S["marketer/integrations"]=()=>head(t("marketer")+" · "+t("integrations"),t("integrations"),
  lang=="ar"?"ربط متجرك بمنصّات التجارة الإلكترونية":"Connect your store to e-commerce platforms")+intgBody();

function failTag(code){
  const C={INVALID_PHONE:['#B45309','#FEF3C7'],OUT_OF_STOCK:['#C2410C','#FFEDD5'],
    STORE_CLOSED:['#475569','#F1F5F9'],PRICE_BELOW_BASE:['#DC2626','#FEE2E2'],
    INTEGRATION_TIMEOUT:['#1D4ED8','#DBEAFE'],INTEGRATION_SCHEMA:['#7C3AED','#EDE9FE']};
  const [c,b]=C[code]||['#475569','#F1F5F9'];
  return `<span class="ftag" style="color:${c};background:${b}">${code}</span>`;
}

function failCard(d){
  return `<div class="fcard">
    <div style="display:flex;flex-direction:column;gap:7px;flex-shrink:0">
      <button class="btn sm">${t('fix_'+d.code)}</button>
      ${d.auto?`<span class="tag" style="color:#0D9488;background:#D8F1ED;font-size:10.5px">${t('autoRetry')}</span>`:''}
    </div>
    <div class="fcard-body">
      <div class="fcard-top">
        <span style="font-weight:700;font-size:12.5px">${d.order}</span>
        ${failTag(d.code)}
        <span class="note">${d.src}</span>
      </div>
      <div class="fcard-desc">${t('desc_'+d.code)}</div>
      <div class="fcard-meta">${d.attempts}</div>
    </div>
  </div>`;
}

function apprTag(s){
  const M={approved:['معتمد','#16A34A'],pending:['بانتظار الاعتماد','#F59E0B'],
    rejected:['مرفوض','#DC2626'],draft:['مسودة','#475569']};
  const [x,c]=M[s]||['—','#475569'];
  return tag(x,c);
}

function rateTag(pct,inverted){
  const v=parseFloat(pct);
  const c=inverted?(v<=5?'#16A34A':v<=12?'#F59E0B':'#DC2626'):(v>=75?'#16A34A':v>=65?'#F59E0B':'#DC2626');
  return `<span style="color:${c};font-weight:700">${pct}%</span>`;
}
function statHero(period,country,total,totalLbl,deliveryRate,netProfit,netProfitLbl){
  return `<div class="stats-hero">
    <div class="hero-l"><h2>${period} · ${country}</h2>
      <div class="big">${total}</div><div class="meta">${totalLbl}</div></div>
    <div class="hero-m"><h3>${t('deliveryRate')}</h3><b>${deliveryRate}</b>
      <div class="pct">${lang=='ar'?'من إجمالي الطلبات':'of total orders'}</div></div>
    <div class="hero-r"><h3>${netProfitLbl}</h3><b>${netProfit}</b>
      <div class="pct">${lang=='ar'?'بعد التسليم':'after delivery'}</div></div>
  </div>`;
}
function statTiles(rows){
  return `<div class="tile-grid">`+rows.map(r=>`
    <div class="stile"><div class="stile-bar" style="background:${r[2]}"></div>
      <div class="stl-lbl"><i style="background:${r[2]}"></i>${r[0]}</div>
      <div class="stl-val" style="color:${r[2]}">${r[1]}</div>
      ${r[3]?`<div class="stl-sub">${r[3]}</div>`:''}</div>`).join('')+`</div>`;
}
function orderTimeline(currentStatus){
  const flow=['pending','confirmed','packing','shipped','delivered'];
  const idx=flow.indexOf(currentStatus);
  const cancelled=(currentStatus==='cancelled'||currentStatus==='returned');
  const labels={pending:'قيد الانتظار',confirmed:'تم التأكيد',packing:'قيد التغليف',shipped:'تم الشحن',delivered:'تم التسليم'};
  const labelsEn={pending:'Pending',confirmed:'Confirmed',packing:'Packing',shipped:'Shipped',delivered:'Delivered'};
  return `<div class="tline">`+flow.map((s,i)=>{
    let cls=cancelled?'muted':(i<idx?'done':i===idx?'current':'muted');
    const L=lang=='ar'?labels[s]:labelsEn[s];
    return `<div class="tstep ${cls}"><div class="ts-l">${L}</div>
      <div class="ts-d">${i<=idx&&!cancelled?'2026/05/'+(28+i):'—'}</div></div>`;
  }).join('')+(cancelled?`<div class="tstep current" style="margin-top:4px"><div class="ts-l" style="color:#DC2626">${stTag(currentStatus)}</div></div>`:'')+`</div>`;
}

function pager(total){
  return `<div class="pager">
    <button class="btn ghost sm">‹‹</button>
    <button class="on" style="padding:5px 11px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer">1</button>
    <button style="padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--slate);cursor:pointer">2</button>
    <button style="padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--slate);cursor:pointer">3</button>
    <button class="btn ghost sm">>>›</button>
    <div class="pp" style="display:flex;align-items:center;gap:6px;margin-inline-start:auto">
      <span style="font-size:12px;color:var(--muted);font-weight:600">${t('perPage')}</span>
      <select style="padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--card)">
        <option>25</option><option>50</option><option>100</option>
      </select>
    </div>
    <span style="font-size:12px;color:var(--muted);font-weight:600">${total} ${lang=='ar'?'نتيجة':'results'}</span>
  </div>`;
}

let _exId=0;
function ordTableRich(rows,opts){
  opts=opts||{};
  const cols=[' ',t('c_product'),t('orderCode')+' / '+t('c_date'),t('c_customer'),t('govLabel'),t('qty'),t('c_total')];
  if(opts.profit) cols.push(`<span style="color:#0D9488">${t('netProfit')}</span>`);
  if(opts.due) cols.push(t('dueAmount'));
  if(opts.marketer) cols.push(t('marketerLabel'));
  if(opts.cod) cols.push(t('codStatus'));
  cols.push(t('c_status'),t('c_action'));
  const codColors={pending:['#F59E0B','#FEF3C7'],collected:['#16A34A','#ECFDF5'],returned:['#DC2626','#FEE2E2']};
  let html=`<div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const id='ex'+(++_exId);
    const showEdit=(r.status==='pending');
    const showCancel=(r.status==='pending'||r.status==='confirmed'||r.status==='packing');
    let actions=showEdit?`<button class="btn ghost sm" style="margin-inline-end:4px">${t('editOrder')}</button>`:'';
    actions+=showCancel?`<button class="btn sm" style="background:#FEE2E2;color:#DC2626">${t('cancelOrder')}</button>`:'';
    if(!actions) actions='—';
    const chevTd=`<td style="width:34px"><span class="chev" id="chev_${id}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></td>`;
    const tds=[(r.items&&r.items.length>1?prod(r.emoji,r.items[0].n,r.items[0].sku):prod(r.emoji,r.name,r.sku))+(r.items&&r.items.length>1?`<span class="tag" style="color:#0D9488;background:#D8F1ED;margin-inline-start:6px">+${r.items.length-1} ${lang=='ar'?'إضافي':'more'}</span>`:''),
      `<div style="font-weight:700;font-size:12px">${r.code}</div><div class="note">${r.date}</div>`,
      `<div style="font-weight:600;font-size:12.5px">${r.customer}</div><div class="note">${r.phone}</div>`,
      r.gov,r.qty,'<b>'+r.total+' '+ccy()+'</b>'];
    if(opts.profit) tds.push(`<b style="color:#0D9488">${r.profit} ${ccy()}</b>`);
    if(opts.due) tds.push(`<b>${r.due} ${ccy()}</b>`);
    if(opts.marketer) tds.push(r.marketer||'—');
    if(opts.cod){const[cc,cb]=codColors[r.cod]||['#475569','#F1F5F9'];tds.push(`<span class="tag" style="color:${cc};background:${cb}">${r.cod==='pending'?t('cod_pending'):r.cod==='collected'?t('cod_collected'):t('cod_returned')}</span>`);}
    tds.push(stTag(r.status),actions);
    html+=`<tr onclick="(function(tr){var p=tr.nextElementSibling;tr.classList.toggle('exrow-open');p.style.display=p.style.display==='none'?'table-row':'none';})(this)" style="cursor:pointer">
      ${chevTd}${tds.map(c=>`<td>${c}</td>`).join('')}</tr>
    <tr id="panel_${id}" class="exrow-panel" style="display:none"><td colspan="${cols.length}">
      <div class="expanel-grid">
        <div class="expanel-block"><h4>${t('fullAddress')}</h4><p>${r.gov} · ${r.city||'المدينة'} · ${r.street||'الشارع'} · ${r.bldg||'عمارة 5'} · ${r.floor||'دور 3'} · ${r.apt||'شقة 12'}</p></div>
        <div class="expanel-block"><h4>${lang=='ar'?'مسار الطلب':'Order Timeline'}</h4>${orderTimeline(r.status)}</div>
      </div>
      <div class="expanel-block" style="grid-column:1/-1;margin-top:10px"><h4>${lang=='ar'?'منتجات الطلب':'Order Items'}</h4>
        ${tbl([t('c_product'),'SKU',t('qty'),lang=='ar'?'السعر':'Price',t('c_total')],(r.items||[{n:r.name,sku:r.sku,qty:r.qty,price:r.total}]).map(it=>[it.n,it.sku,it.qty,it.price+' '+ccy(),(it.qty*it.price)+' '+ccy()]))}
      </div>
      <div class="expanel-grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">
        <div class="expanel-block"><h4>${t('shippingInfo')}</h4><p>${r.courier||'بوسطة'}</p><p>${t('trackingNo')}: BOS-${r.code}</p></div>
        <div class="expanel-block"><h4>${t('paymentInfo')}</h4><p>${t('codLabel')}</p><p>${r.cod==='collected'?t('cod_collected'):r.cod==='returned'?t('cod_returned'):t('cod_pending')}</p></div>
        <div class="expanel-block"><h4>${t('notesAttempts')}</h4><p>${t('clientNote')}: ${r.note||'—'}</p><p>${t('callAttempts')}: ${r.calls||0}</p></div>
      </div>
    </td></tr>`;
  });
  html+=`</tbody></table></div>`;
  return html;
}

/* ============ render ============ */
function renderRoleSwitch(){
  document.getElementById("roleSwitch").innerHTML=["admin","merchant","marketer"]
    .map(r=>`<button class="${r==state.role?'on':''}" onclick="setRole('${r}')">${t(r)}</button>`).join('');
}
function renderNav(){
  document.getElementById("nav").innerHTML=ROLES[state.role].nav.map(n=>{
    if(n.g)return `<div class="grp">${t(n.g)}</div>`;
    const hasSub=!!n.sub;
    const open = hasSub && ((n.id in state.open) ? state.open[n.id] : (n.id===state.screen || n.sub.some(c=>c.id===state.screen)));
    const chev = hasSub ? `<button class="navchev ${open?'open':''}" onclick="event.stopPropagation();toggleSub('${n.id}')" aria-label="${t(n.id)}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>` : '';
    const kids = open ? `<div class="navsub">`+n.sub.map(c=>`<button class="navitem sub ${c.id==state.screen?'on':''}" onclick="go('${c.id}')">${svg(IC[c.ic])}<span>${t(c.id)}</span>${c.badge?`<span class="badge">${c.badge}</span>`:''}</button>`).join('')+`</div>` : '';
    return `<div class="navrow ${n.id==state.screen?'on':''}">
      <button class="navitem main" onclick="go('${n.id}')">${svg(IC[n.ic])}<span>${t(n.id)}</span>${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>
      ${chev}
    </div>${kids}`;
  }).join('');
}
function renderScreen(){
  const fn=S[state.role+"/"+state.screen];
  document.getElementById("main").innerHTML=fn?fn():'<div class="empty">—</div>';
  window.scrollTo(0,0);
}
function renderChrome(){
  document.documentElement.dir=I18N[lang].dir;
  document.documentElement.lang=lang;
  document.getElementById("appName").textContent=t("app");
  document.getElementById("appNameSub").textContent=t("appSub");
  document.getElementById("langBtn").textContent=t("lang");
  document.getElementById("userName").textContent=t("u_"+state.role);
  document.getElementById("userRole").textContent=t("rl_"+state.role);
  document.getElementById("userAv").textContent=t("u_"+state.role).trim()[0];
  document.getElementById("cFlag").textContent = COUNTRIES[country].flag;
  document.getElementById("cName").textContent = cName();
}
function go(id){
  state.screen=id;
  ROLES[state.role].nav.forEach(n=>{ if(n.sub && n.sub.some(c=>c.id===id)) state.open[n.id]=true; });
  renderNav();renderScreen();closeNav();
}
function toggleSub(id){
  const n=ROLES[state.role].nav.find(x=>x.id===id);
  const auto = id===state.screen || (n&&n.sub ? n.sub.some(c=>c.id===state.screen) : false);
  const cur = (id in state.open) ? state.open[id] : auto;
  state.open[id]=!cur;
  renderNav();
}
function setRole(r){state.role=r;state.screen=FIRST[r];renderRoleSwitch();renderChrome();renderNav();renderScreen();closeNav();}
function toggleNav(){const s=document.getElementById("side"),sc=document.getElementById("scrim");const open=s.classList.toggle("open");sc.classList.toggle("show",open);}
function closeNav(){const s=document.getElementById("side"),sc=document.getElementById("scrim");if(s)s.classList.remove("open");if(sc)sc.classList.remove("show");}
function toggleLang(){lang=lang=="ar"?"en":"ar";renderAll();}
function toggleCountry(){ country = country==="EG"?"SA":"EG"; renderAll(); }
function renderAll(){renderChrome();renderRoleSwitch();renderNav();renderScreen();}
function setTab(id,btn){
  const pane=document.getElementById('tab-'+id);const parent=pane.parentElement;
  parent.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('on'));
  pane.classList.add('on');
  btn.closest('.tabs').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function chip(el){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}

renderAll();
</script>
