    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5670"/><stop offset="0.5" stop-color="#a47c5e"/><stop offset="1" stop-color="#e6b88a"/></linearGradient>
    <linearGradient id="cClouds" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe4ec" stop-opacity="0.95"/><stop offset="1" stop-color="#a7b1c0" stop-opacity="0.85"/></linearGradient>
