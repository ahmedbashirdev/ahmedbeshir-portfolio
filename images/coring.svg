    <text x="14" y="42" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#0e1623">"Not therapy. Not a script.</text>
    <text x="14" y="58" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#0e1623">A structured methodology</text>
    <text x="14" y="74" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#0e1623">for self-understanding."</text>
